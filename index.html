<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PETRONE BR-PT-100</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5edf9;font:16px system-ui;text-align:center}main{max-width:650px;margin:auto;padding:20px}h1{font-size:23px}#status{padding:14px;background:#192840;border-radius:12px;margin:14px 0}button{border:0;border-radius:12px;background:#089cbd;color:white;padding:14px;font-weight:700;font-size:16px;margin:5px}button:disabled{background:#455066}#stop{background:#bb2633;width:95%;font-size:20px}#arm{background:#ab750d}.sticks{display:flex;justify-content:space-around;gap:12px;margin:22px 0}.stick{width:min(43vw,245px);aspect-ratio:1;border:3px solid #51627d;border-radius:50%;position:relative;background:#18273c;touch-action:none;user-select:none}.nub{width:35%;height:35%;background:#13a9c7;border-radius:50%;position:absolute;left:32.5%;top:32.5%;pointer-events:none;box-shadow:0 0 24px #0899c555}.labels{display:flex;justify-content:space-around;color:#b5c1d5;font-size:14px}pre{text-align:left;white-space:pre-wrap;word-break:break-word;background:#131f30;border-radius:12px;padding:12px;max-height:180px;overflow:auto;font-size:12px}.note{font-size:13px;color:#c3cee0}
/* iPhone yatay kullanım: yalnızca görünüm değişir, BLE komutları aynıdır. */
@media (orientation: landscape) {
 html,body {width:100%;height:100%;overflow:hidden}
 main {position:relative;max-width:none;width:100vw;height:100dvh;padding:5px 12px;overflow:hidden}
 h1 {font-size:15px;margin:0 0 3px}
 #status {display:inline-block;max-width:50%;padding:5px 10px;margin:0 5px;font-size:12px}
 button {font-size:12px;padding:7px 10px;margin:2px}
 #connect,#disconnect {vertical-align:middle}
 .sticks {position:absolute;left:2%;right:2%;top:23%;height:58%;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
 .stick {width:min(55dvh,33vw);height:min(55dvh,33vw);flex:none;aspect-ratio:1}
 .labels {position:absolute;top:80%;left:3%;right:3%;font-size:11px}
 .labels span {width:40%;text-align:center}
 #values {position:absolute;bottom:6px;left:50%;transform:translateX(-50%);margin:0;font-size:11px;white-space:nowrap}
 #arm {position:absolute;bottom:30px;left:37%;width:26%;margin:0;padding:9px 3px;font-size:12px}
 #stop {position:absolute;bottom:65px;left:39%;width:22%;margin:0;padding:9px 3px;font-size:15px}
 .note,#copy,#log {display:none}
}
</style><main><h1>PETRONE BR-PT-100</h1><div id="status">Bağlı değil</div><button id="connect">Bluetooth'a bağlan</button><button id="disconnect">Bağlantıyı kes</button><div class="sticks"><div class="stick" id="left"><div class="nub"></div></div><div class="stick" id="right"><div class="nub"></div></div></div><div class="labels"><span>Gaz ↑↓ / Dönüş ←→</span><span>İleri ↑↓ / Yan ←→</span></div><p id="values">Roll 0 · Pitch 0 · Yaw 0 · Gaz 0</p><button id="arm" disabled>Kontrolü aç (1/2)</button><button id="stop" disabled>DURDUR</button><p class="note">ÖNCE PERVANELERİ ÇIKAR. Bu deneysel kontrol yazılımı gerçek uçuşta doğrulanmamıştır. Bağlantı kopunca komutların drona ulaştığı garanti edilemez. İlk denemeyi yalnızca pervanesiz yap.</p><button id="copy">Günlüğü kopyala</button><pre id="log"></pre></main><script>
'use strict';
const SERVICE='c320df00-7891-11e5-8bcf-feff819cdc9f',RX='c320df01-7891-11e5-8bcf-feff819cdc9f',TX='c320df02-7891-11e5-8bcf-feff819cdc9f';
const $=id=>document.getElementById(id);let device,writeChar,notifyChar,connected=false,armed=false,busy=false,timer=null,armTimer=null,confirmUntil=0;let v={roll:0,pitch:0,yaw:0,throttle:0};let logCount=0;
function log(s){$('log').textContent=`${new Date().toLocaleTimeString()} ${s}\n`+$('log').textContent.slice(0,4500)}
function status(s){$('status').textContent=s}function ui(){ $('arm').disabled=!connected; $('stop').disabled=!connected; $('arm').textContent=armed?'Kontrol aktif — kapat':'Kontrolü aç (1/2)';$('values').textContent=`Roll ${v.roll} · Pitch ${v.pitch} · Yaw ${v.yaw} · Gaz ${v.throttle}`}
async function send(bytes){if(!connected||!writeChar||busy)return false;busy=true;try{await writeChar.writeValue(new Uint8Array(bytes));return true}catch(e){log('Yazma hatası: '+e.message);disarm();return false}finally{busy=false}}
function disarm(){armed=false;v={roll:0,pitch:0,yaw:0,throttle:0};resetSticks();ui()}
async function stop(){disarm();if(connected){await send([0x10,0,0,0,0]);await send([0x11,0x24,0]);log('Durdur komutu gönderildi (alındığı doğrulanmadı)')}}
function lost(){connected=false;writeChar=null;clearInterval(timer);timer=null;disarm();status('Bağlantı kesildi — motorların durduğu doğrulanamaz');log('BLE bağlantısı kesildi')}
$('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Bu tarayıcı Web Bluetooth desteklemiyor');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'PETRONE'}],optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',lost);const server=await device.gatt.connect(),service=await server.getPrimaryService(SERVICE);writeChar=await service.getCharacteristic(TX);notifyChar=await service.getCharacteristic(RX);await notifyChar.startNotifications();notifyChar.addEventListener('characteristicvaluechanged',e=>{const a=new Uint8Array(e.target.value.buffer,e.target.value.byteOffset,e.target.value.byteLength);if(logCount++<50)log('RX '+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join(' '))});connected=true;status('Bağlandı: '+device.name+' · Kontrol kapalı');log('GATT yazma ve bildirim hazır');ui();timer=setInterval(()=>{if(armed&&connected&&!busy)send([0x10,v.roll&255,v.pitch&255,v.yaw&255,v.throttle&255])},100)}catch(e){log('Bağlantı hatası: '+e.message);status('Bağlantı kurulamadı');lost()}};
$('disconnect').onclick=async()=>{await stop();if(device?.gatt?.connected)device.gatt.disconnect();lost()};$('stop').onclick=stop;
const arm=$('arm');arm.addEventListener('click',()=>{if(!connected)return;if(armed){disarm();confirmUntil=0;log('Kontrol kapatıldı');return}const now=Date.now();if(now>confirmUntil){confirmUntil=now+6000;arm.textContent='ONAYLA — tekrar dokun (6 sn)';log('Kontrol açma onayı bekleniyor');return}confirmUntil=0;armed=true;status('Bağlandı: '+device.name+' · Kontrol AKTİF');log('Kontrol etkinleştirildi — pervaneler çıkarılmış olmalı');ui()});
function resetSticks(){document.querySelectorAll('.nub').forEach(n=>{n.style.left='32.5%';n.style.top='32.5%'})}
function stick(id,cb){const el=$(id),nub=el.querySelector('.nub');let pid=null;function move(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.325;let dx=(e.clientX-cx)/max,dy=(e.clientY-cy)/max;const d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d}nub.style.left=(32.5+dx*32.5)+'%';nub.style.top=(32.5+dy*32.5)+'%';cb(Math.round(dx*45),Math.round(-dy*45));ui()}el.addEventListener('pointerdown',e=>{if(!armed)return;pid=e.pointerId;el.setPointerCapture(pid);move(e)});el.addEventListener('pointermove',e=>{if(pid===e.pointerId)move(e)});function release(e){if(pid!==e.pointerId)return;pid=null;nub.style.left='32.5%';nub.style.top='32.5%';cb(0,0);ui()}el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release)}
stick('left',(x,y)=>{v.yaw=x;v.throttle=y});stick('right',(x,y)=>{v.roll=x;v.pitch=y});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&armed)stop()});window.addEventListener('pagehide',()=>{if(armed)stop()});$('copy').onclick=()=>navigator.clipboard.writeText($('log').textContent).then(()=>log('Günlük kopyalandı')).catch(e=>log(e.message));ui();
</script></html>
