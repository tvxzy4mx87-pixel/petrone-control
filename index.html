<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>PETRONE Control</title><style>body{margin:0;background:#0b1220;color:#e5edf7;font-family:system-ui;text-align:center}main{max-width:600px;margin:auto;padding:24px}button{background:#12a5bd;color:white;border:0;border-radius:12px;padding:16px;font-size:17px;margin:8px}button:disabled{background:#344256;color:#a5afbd}.status{padding:16px;background:#172339;border-radius:12px;margin:20px 0}.sticks{display:flex;gap:16px;justify-content:space-around;margin:30px 0}.stick{border:2px solid #40516b;border-radius:50%;width:145px;height:145px;display:grid;place-items:center;background:radial-gradient(circle,#1c334b,#111c30)}.knob{width:52px;height:52px;background:#11a3c2;border-radius:50%;box-shadow:0 0 18px #1189aa}small{color:#a5b4c9;display:block;margin:12px}h1{font-size:24px}</style></head><body><main><h1>PETRONE CONTROL</h1><div class="status" id="status">Bağlı değil</div><button id="connect">Bluetooth'a Bağlan</button><button id="disconnect" disabled>Bağlantıyı Kes</button><div class="sticks"><div><div class="stick"><div class="knob"></div></div><small>Gaz / Dönüş</small></div><div><div class="stick"><div class="knob"></div></div><small>Yön Kontrolü</small></div></div><button disabled>Acil durdurma (aktif değil)</button><p>Güvenli bağlantı prototipi. Joystickler komut göndermez. Pervaneleri çıkararak test edin.</p><small id="detail"></small></main><script>
const service='c320df00-7891-11e5-8bcf-feff819cdc9f';let device,server;const status=document.getElementById('status'),detail=document.getElementById('detail'),disc=document.getElementById('disconnect');function disconnected(){status.textContent='Bağlı değil';disc.disabled=true}document.getElementById('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Bu tarayıcı Web Bluetooth desteklemiyor');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[service]});device.addEventListener('gattserverdisconnected',disconnected);status.textContent='Bağlanıyor: '+device.name;server=await device.gatt.connect();const svc=await server.getPrimaryService(service);const chars=await svc.getCharacteristics();status.textContent='Bağlandı: '+device.name;detail.textContent='Bulunan karakteristikler: '+chars.map(c=>c.uuid+' ('+(c.properties.notify?'Notify ':'')+(c.properties.write?'Write ':'')+')').join(', ');disc.disabled=false}catch(e){status.textContent='Bağlantı başarısız';detail.textContent=e.message}};disc.onclick=()=>{if(device?.gatt?.connected)device.gatt.disconnect();disconnected()};
</script></body></html>
